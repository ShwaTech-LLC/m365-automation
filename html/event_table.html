
<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Event Table Example</title>
	<style>
		body {
			font-family: 'Segoe UI', Arial, sans-serif;
			background: #f4f6f8;
			margin: 40px;
		}
		table {
			border-collapse: collapse;
			width: 60%;
			margin: 0 auto;
			background: #fff;
			box-shadow: 0 2px 8px rgba(0,0,0,0.07);
			border-radius: 8px;
			overflow: hidden;
		}
		th, td {
			padding: 14px 18px;
			text-align: left;
		}
		th {
			background: #0078d4;
			color: #fff;
			font-weight: 600;
			letter-spacing: 0.03em;
		}
		tr:nth-child(even) {
			background: #f2f6fa;
		}
		tr:hover {
			background: #e6f0fa;
		}
	</style>
</head>
<body>
	<h2 style="text-align:center; color:#333;">Event Table Example</h2>
    <h4 style="text-align:center; color:#666;">You have 1 event(s) coming up in the next 30 days.</h4>
	<table>
		<thead>
			<tr>
				<th>Date</th>
				<th>Title</th>
				<th>Month</th>
				<th>Day</th>
			</tr>
		</thead>
		<tbody>
			<tr>
				<td>2026-05-07</td>
				<td>Spring Conference</td>
				<td>May</td>
				<td>Thursday</td>
			</tr>
		</tbody>
	</table>
</body>
</html>
